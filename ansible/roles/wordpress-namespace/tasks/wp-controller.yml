- tags: always
  include_vars: "{{ item }}"
  with_items:
  - image-vars.yml
  - ../../../vars/quay-vars.yml

- name: ServiceAccount/wp-controller
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: wp-controller
        namespace: "{{ inventory_namespace }}"

- name: Role/wp-controller
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: wp-controller
        namespace: "{{ inventory_namespace }}"
      rules:
        - apiGroups: ["wordpress.epfl.ch"]
          resources: ["wordpresssites"]
          verbs: ["get", "list", "watch", "patch"]
        - apiGroups: ["k8s.mariadb.com"]
          resources: ["databases", "users"]
          verbs: ["list"]
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["list"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "patch"]

- name: RoleBinding/wp-controller
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: wp-controller
        namespace: "{{ inventory_namespace }}"
      subjects:
        - kind: ServiceAccount
          name: wp-controller
          namespace: "{{ inventory_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: wp-controller

- name: "Deployment/wp-controller"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: wp-controller
        namespace: "{{ inventory_namespace }}"
      spec: >-
        {{ lookup("template", "wp-controller-deployment-spec.yaml",
                  template_vars=dict(
                      image_tag=wp_controller_image_tag,
                      php_image_tag=nginx_deployment_images_tag,
                      app_label="wp-controller"))
        | from_yaml }}

- name: "Service/wp-controller"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: wp-controller
        namespace: "{{ inventory_namespace }}"
        labels:
          app: wp-controller
        annotations:
          authors: isas-fsd
      spec:
        ports:
        - name: "80"
          port: 80
          protocol: TCP
          targetPort: 8080
        selector:
          app: wp-controller
        type: ClusterIP
