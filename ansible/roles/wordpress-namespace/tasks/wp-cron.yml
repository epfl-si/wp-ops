- include_vars: ../../../vars/quay-vars.yml
  tags: always

# Additional to Role/wp-cron and RoleBinding/wp-cron, which wp-operator's OLM
# controller manages (do not redefine those here): what `wp` (docker/wp-base/wp.sh)
# reads to find a site's database, through the objects' ownerReferences.
- name: Role/wp-cron-sites
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: wp-cron-sites
        namespace: "{{ inventory_namespace }}"
      rules:
        - apiGroups: ["k8s.mariadb.com"]
          resources: ["databases", "users"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get"]

- name: RoleBinding/wp-cron-sites
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: wp-cron-sites
        namespace: "{{ inventory_namespace }}"
      subjects:
        - kind: ServiceAccount
          name: wp-cron
          namespace: "{{ inventory_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: wp-cron-sites

- name: CronJob/wp-cron
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: wp-cron
        namespace:  "{{ inventory_namespace }}"
      spec:
        schedule: "7 * * * *"
        timeZone: "Europe/Zurich"
        jobTemplate:
          spec:
            template:
              metadata:
                labels:
                  app: wp-cron
              spec:
                # The serviceAccount is managed by the OLM controller in wp-operator/operator-namespaced.yaml,
                # because it requires rights that a human operator doesn't have
                serviceAccountName: wp-cron
                containers:
                  - name: wp-cron
                    image: "quay-its.epfl.ch/svc0041/wp-cron:{{ _wp_cron_tag }}"
                    imagePullPolicy: Always
                    env:
                      - name: K8S_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    command:
                      - python3
                      - /wp-cron.py
                    resources:
                      requests:
                        cpu: '{{ _cpu_request }}'
                        memory: 512Mi
                      limits:
                        memory: 512Mi
                imagePullSecrets:
                  - name: "{{ quay_puller_secret_name }}"
                restartPolicy: OnFailure
        concurrencyPolicy: Forbid
  vars:
    _cpu_request: >-
      {{ "200m" if inventory_deployment_stage == "production"
      else "50m" }}
    _wp_cron_tag: >-
      {{ "prod" if inventory_deployment_stage == "production"
      else "latest" }}
