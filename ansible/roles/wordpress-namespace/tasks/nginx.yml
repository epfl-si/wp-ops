- tags: always
  include_vars: "{{ item }}"
  with_items:
  - image-vars.yml
  - ../../../vars/quay-vars.yml
  - "opdo-secrets-{{ inventory_deployment_stage }}.yml"

- name: "Mirror the php-fpm exporter image"
  run_once: true
  include_tasks:
    file: _mirror.yml
  vars:
    mirror_name: php-fpm_exporter
    # https://github.com/tonmnn/php-fpm_exporter/pkgs/container/php-fpm_exporter
    mirror_from: "ghcr.io/tonmnn/php-fpm_exporter"
    mirror_tags: ["2"]

- name: ConfigMap/opdo-ca
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: opdo-ca
        namespace: "{{ inventory_namespace }}"
      data:
        opdo-ca.crt: "{{ certificate }}"

- name: ConfigMap/wp-nginx
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: wp-nginx
        namespace: "{{ inventory_namespace }}"
      # Empty unless debugging. Uncomment the next lines (and the matching
      # ones in ../templates/nginx-deployment-spec.yaml) to test an nginx
      # configuration from a local checkout of wp-controller:
      # data:
      #   wordpress.conf.j2: >-
      #     {{ lookup("file", "../../../../../wp-controller/src/templates/wordpress.conf.j2") }}
      #   generic.conf: >-
      #     {{ lookup("file", "../../../../../wp-controller/src/templates/generic.conf") }}
      #   fastcgi.conf: >-
      #     {{ lookup("file", "../../../../../wp-controller/src/templates/fastcgi.conf") }}

- name: ServiceAccount/wp-nginx
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: wp-nginx
        namespace: "{{ inventory_namespace }}"

- name: Role/wp-nginx
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: wp-nginx
        namespace: "{{ inventory_namespace }}"
      rules:
        - apiGroups: ["wordpress.epfl.ch"]
          resources: ["wordpresssites"]
          verbs: ["get", "list", "watch", "patch"]
        # Read-only lookup of the Database/User that wp-operator provisions for
        # each WordpressSite, and of the Secret with its password: listed on
        # each sync and also watched, so that a change triggers a re-sync.
        - apiGroups: ["k8s.mariadb.com"]
          resources: ["databases", "users"]
          verbs: ["list", "watch"]
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["list", "watch"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "patch"]

- name: RoleBinding/wp-nginx
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: wp-nginx
        namespace: "{{ inventory_namespace }}"
      subjects:
        - kind: ServiceAccount
          name: wp-nginx
          namespace: "{{ inventory_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: wp-nginx

- name: "Deployment/wp-nginx"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: wp-nginx
        namespace: "{{ inventory_namespace }}"
      spec: >-
        {{ lookup("template", "nginx-deployment-spec.yaml",
                  template_vars=dict(
                      image_tag=nginx_deployment_images_tag,
                      app_label="wp-nginx",
                      additional_pod_labels=dict(version="wp-nginx-" +
                                                 nginx_deployment_images_tag)))
        | from_yaml }}

- name: PodDisruptionBudget/wp-nginx
  when: inventory_deployment_stage == "production"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: wp-nginx
        namespace: "{{ inventory_namespace }}"
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app: wp-nginx

- name: PodMonitor/wp-nginx
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: wp-nginx
        namespace: "{{ inventory_namespace }}"
      spec:
        selector:
          matchLabels:
            app: wp-nginx
        podMetricsEndpoints:
          - port: php-fpm-metrics
          - port: nginx-metrics
          - port: ctrl-metrics

- name: "Service/wp-nginx"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: wp-nginx
        namespace: "{{ inventory_namespace }}"
        labels:
          app: wp-nginx
        annotations:
          authors: isas-fsd
      spec:
        ports:
        - name: "80"
          port: 80
          protocol: TCP
          targetPort: 8080
        selector:
          app: wp-nginx
        type: ClusterIP
